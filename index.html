<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NEXA — Navigating the Future with AI. Gim edukasi literasi AI untuk siswa SMP: rancang sekolah, kota, dunia kerja, dan konstitusi tahun 2045.">
  <meta name="theme-color" content="#071426">
  <!-- Pratinjau tautan (WhatsApp, Facebook, X). og:url dan og:image wajib URL absolut. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NEXA">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="NEXA — Navigating the Future with AI">
  <meta property="og:description" content="Gim edukasi literasi AI untuk SMP: rancang sekolah, kota, dunia kerja, dan konstitusi tahun 2045.">
  <meta property="og:url" content="https://ramli-labs.github.io/nexa/">
  <meta property="og:image" content="https://ramli-labs.github.io/nexa/assets/images/og-nexa.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NEXA — gim edukasi literasi AI untuk SMP">
  <meta name="twitter:card" content="summary_large_image">
  <title>NEXA — Navigating the Future with AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="stylesheet" href="css/main.css">

  <!-- Mesin template: merender template x-dc di body memakai React di atas. JANGAN tulis tag x-dc di komentar mana pun: runtime mencarinya dengan regex pada teks mentah.
       Template dibungkus <template> supaya browser tidak memproses SVG berisi {{ }} (sumber error console). -->
  <!-- React dimuat sebagai skrip biasa (tanpa SRI/CORS) supaya gim tetap jalan saat index.html
       dibuka langsung dari berkas (file://) di Chrome, Edge, dan Safari. -->
  <script src="js/vendor/react.production.min.js"></script>
  <script src="js/vendor/react-dom.production.min.js"></script>
  <script src="js/vendor/dc-runtime.js"></script>
  <!-- Visual, suara, musik latar -->
  <script defer src="js/nexa-visuals.js"></script>
  <script defer src="js/voice-config.js"></script>
  <script defer src="js/voice-manager.js"></script>
  <script defer src="js/bgm.js"></script>
  <script defer src="js/tata-letak.js"></script>
  <script defer src="js/offline.js"></script>
</head>
<body>
<template id="nexa-dc">
<x-dc>

<div style="position:relative;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 120%,#0d2a4a 0%,#071426 55%);color:#F5F8FC" onClick="{{ armAudio }}">

<div style="position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(23,217,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(23,217,255,.06) 1px,transparent 1px);background-size:64px 64px;animation:nx-grid 12s linear infinite;mask-image:linear-gradient(to bottom,transparent,black 30%,black 70%,transparent)"></div>
<div style="position:fixed;left:50%;top:-20%;width:70vw;height:50vh;transform:translateX(-50%);pointer-events:none;background:radial-gradient(ellipse,rgba(118,87,255,.22),transparent 70%)"></div>

<!-- ══════ HEADER INSTITUSIONAL ══════ -->
<sc-if value="{{ headerFull }}" hint-placeholder-val="{{ true }}">
<div style="position:relative;z-index:25;background:#FFFFFF;border-bottom:1px solid rgba(7,20,38,.1);box-shadow:0 2px 10px rgba(7,20,38,.14)">
  <div class="nx-inst" style="max-width:1500px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
    <img src="assets/images/logo-kemendikdasmen.png" alt="Kementerian Pendidikan Dasar dan Menengah" style="height:56px;width:auto;display:block;flex:none">
    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
      <img src="assets/images/logo-pendidikan-bermutu.png" alt="Pendidikan Bermutu Untuk Semua" style="height:34px;width:auto;display:block">
      <img src="assets/images/logo-ramah.png" alt="Kemendikdasmen RAMAH" style="height:34px;width:auto;display:block">
      <img src="assets/images/logo-sobat-smp.png" alt="Sobat SMP" style="height:38px;width:auto;display:block">
    </div>
  </div>
</div>
</sc-if>
<sc-if value="{{ headerCompact }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;z-index:25;background:#FFFFFF;border-bottom:1px solid rgba(7,20,38,.1);box-shadow:0 1px 6px rgba(7,20,38,.12)">
  <div class="nx-inst" style="max-width:1500px;margin:0 auto;padding:6px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <img src="assets/images/logo-kemendikdasmen.png" alt="Kementerian Pendidikan Dasar dan Menengah" style="height:36px;width:auto;display:block;flex:none">
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <img src="assets/images/logo-pendidikan-bermutu.png" alt="Pendidikan Bermutu Untuk Semua" style="height:20px;width:auto;display:block">
      <img src="assets/images/logo-ramah.png" alt="Kemendikdasmen RAMAH" style="height:20px;width:auto;display:block">
      <img src="assets/images/logo-sobat-smp.png" alt="Sobat SMP" style="height:23px;width:auto;display:block">
    </div>
  </div>
</div>
</sc-if>

<!-- ══════ 01 OPENING ══════ -->
<sc-if value="{{ isOpening }}" hint-placeholder-val="{{ true }}">
<div style="position:relative;min-height:calc(100vh - 92px);display:grid;place-items:center;padding:30px 24px;animation:nx-in 1.2s ease both" data-screen-label="01 Opening">
  <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none"><div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(23,217,255,.08) 50%,transparent 55%);animation:nx-scan 5s linear infinite"></div></div>
  <div style="text-align:center;max-width:880px;position:relative">
    <div style="position:relative;display:inline-grid;place-items:center;margin-bottom:6px">
      <div style="position:absolute;width:min(320px,60vw);height:min(320px,60vw);border-radius:50%;border:1px solid rgba(23,217,255,.2);animation:nx-spin 40s linear infinite"></div>
      <div style="position:absolute;width:min(240px,46vw);height:min(240px,46vw);border-radius:50%;border:1px dashed rgba(118,87,255,.35);animation:nx-spin-rev 28s linear infinite"></div>
      <div style="font-family:Orbitron,Bahnschrift,'DIN Alternate',system-ui,sans-serif;font-weight:800;font-size:clamp(52px,11vw,120px);letter-spacing:.28em;background:linear-gradient(90deg,#17D9FF,#F5F8FC 50%,#7657FF);-webkit-background-clip:text;background-clip:text;color:transparent;animation:nx-logo 2.4s ease-out both;padding-left:.28em">NEXA</div>
    </div>
    <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:clamp(10px,1.6vw,13px);letter-spacing:.3em;color:#91A4B8;animation:nx-in 1s .8s ease both">NAVIGATING THE FUTURE WITH AI</div>
    <div style="display:inline-block;margin-top:18px;padding:8px 22px;border:1px solid rgba(53,242,161,.5);border-radius:999px;font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:11px;letter-spacing:.28em;color:#35F2A1;animation:nx-in 1s 1.1s ease both">DESIGN THE FUTURE</div>
    <p style="font-size:clamp(15px,1.7vw,20px);line-height:1.55;color:#C9D4E0;margin:26px auto 0;max-width:680px;text-wrap:pretty;animation:nx-in 1s 1.3s ease both">Tahun 2045. Kecerdasan buatan hadir di sekolah, pekerjaan, kota, dan keputusan manusia. Kamu adalah <strong style="color:#F5F8FC">Future Architect</strong> — dan masa depan dirancang oleh pilihanmu.</p>
    <div style="margin:20px auto 0;max-width:760px;animation:nx-in 1s 1.3s ease both">
      <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:11px;letter-spacing:.28em;color:#91A4B8;margin-bottom:10px">TUJUAN PEMBELAJARAN</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
        <sc-for list="{{ objectives }}" as="o" hint-placeholder-count="4"><span title="{{ o.t }}" style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid {{ o.border }};background:{{ o.bg }};font-size:13px;color:#E4ECF5"><span style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:10px;color:{{ o.c }}">{{ o.n }}</span>{{ o.h }}</span></sc-for>
      </div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px;animation:nx-in 1s 1.5s ease both">
      <button onClick="{{ toObjective }}" style="background:linear-gradient(90deg,#17D9FF,#7657FF);color:#071426;border:none;border-radius:999px;padding:17px 38px;font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-weight:700;font-size:14px;letter-spacing:.2em;cursor:pointer;box-shadow:0 0 30px rgba(23,217,255,.45);min-height:52px" style-hover="box-shadow:0 0 44px rgba(23,217,255,.8);transform:translateY(-2px)">MULAI ›</button>
      <sc-if value="{{ hasSave }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ continueSave }}" style="background:transparent;color:#35F2A1;border:1px solid rgba(53,242,161,.5);border-radius:999px;padding:16px 28px;font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;cursor:pointer;min-height:52px" style-hover="background:rgba(53,242,161,.1)">LANJUTKAN · {{ saveDone }}/4 ›</button>
      </sc-if>
      <button onClick="{{ toTutorial }}" style="background:transparent;color:#91A4B8;border:1px solid rgba(145,164,184,.35);border-radius:999px;padding:16px 24px;font-size:13px;letter-spacing:.12em;cursor:pointer;min-height:52px" style-hover="border-color:#17D9FF;color:#17D9FF">CARA BERMAIN</button>
    </div>
    <div style="font-size:12px;color:#91A4B8;margin-top:26px;letter-spacing:.05em">Gim edukasi literasi AI · SMP · 1 sesi kelas ± 40 menit</div>
    <div style="font-size:11.5px;color:#91A4B8;margin-top:8px;line-height:1.5">Suara tokoh, gambar, dan musik dibuat dengan bantuan AI · <button onClick="{{ openCredits }}" style="background:none;border:none;color:#B8A6FF;text-decoration:underline;cursor:pointer;font-size:11.5px;padding:10px 4px;min-height:44px">Kredit &amp; keterangan AI</button></div>
  </div>
</div>
</sc-if>

<!-- ══════ 02 LEARNING OBJECTIVE ══════ -->
<sc-if value="{{ isObjective }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;min-height:calc(100vh - 92px);display:grid;place-items:center;padding:36px 24px 176px;animation:nx-in .8s ease both" data-screen-label="02 Tujuan Pembelajaran">
  <div style="width:min(1180px,100%);display:flex;gap:30px;align-items:flex-start;justify-content:center;flex-wrap:wrap">
   <div style="flex:1 1 560px;min-width:0">
    <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:11px;letter-spacing:.38em;color:#17D9FF">TUJUAN PEMBELAJARAN</div>
    <h1 style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,40px);margin:12px 0 10px;letter-spacing:.04em;line-height:1.15">Apa yang akan kamu pelajari</h1>
    <p style="font-size:clamp(14px,1.4vw,17px);color:#C9D4E0;max-width:700px;margin:0 0 26px;line-height:1.6;text-wrap:pretty">NEXA bukan kuis. Kamu merancang sistem masa depan, melihat akibatnya, lalu menimbang mana yang layak dibangun. Tidak ada jawaban benar — yang ada adalah konsekuensi.</p>
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <sc-for list="{{ objectives }}" as="o" hint-placeholder-count="4">
        <div style="flex:1 1 220px;padding:20px;border-radius:18px;background:rgba(7,20,38,.7);border:1px solid {{ o.border }};backdrop-filter:blur(10px)">
          <div style="width:38px;height:38px;border-radius:11px;border:1px solid {{ o.c }};display:grid;place-items:center;font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:13px;color:{{ o.c }};background:{{ o.bg }}">{{ o.n }}</div>
          <div style="font-weight:600;font-size:15px;margin:12px 0 6px">{{ o.h }}</div>
          <div style="font-size:13px;color:#C9D4E0;line-height:1.55;text-wrap:pretty">{{ o.t }}</div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:20px;padding:18px 20px;border-radius:18px;background:rgba(53,242,161,.07);border:1px solid rgba(53,242,161,.32)">
      <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:10px;letter-spacing:.3em;color:#35F2A1;margin-bottom:8px">JALUR MISI</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:#C9D4E0">
        <sc-for list="{{ pathway }}" as="p" hint-placeholder-count="6">
          <span style="display:flex;align-items:center;gap:10px"><span style="padding:6px 12px;border-radius:999px;border:1px solid {{ p.border }};color:{{ p.c }};font-size:12px">{{ p.label }}</span><span style="color:#4a5a6e">{{ p.sep }}</span></span>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:28px;flex-wrap:wrap">
      <button onClick="{{ toTutorial }}" style="background:linear-gradient(90deg,#17D9FF,#7657FF);color:#071426;border:none;border-radius:999px;padding:16px 32px;font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.2em;cursor:pointer;box-shadow:0 0 26px rgba(23,217,255,.4);min-height:52px" style-hover="box-shadow:0 0 40px rgba(23,217,255,.7)">CARA BERMAIN ›</button>
      <button onClick="{{ startNew }}" style="background:transparent;color:#91A4B8;border:1px solid rgba(145,164,184,.3);border-radius:999px;padding:15px 24px;font-size:12.5px;letter-spacing:.12em;cursor:pointer;min-height:52px" style-hover="color:#17D9FF;border-color:#17D9FF">LEWATI KE LAB</button>
    </div>
   </div>
   <aside style="flex:0 1 250px;display:flex;flex-direction:column;align-items:center;gap:16px">
     <div style="position:relative;width:250px;height:290px;display:grid;place-items:center;border-radius:24px;background:radial-gradient(70% 60% at 50% 42%,rgba(23,217,255,.13),rgba(7,20,38,0) 72%);border:1px solid rgba(145,164,184,.16)">
       <sc-if value="{{ dlg.isKaia }}" hint-placeholder-val="{{ false }}">
         <mentor-avatar size="212" expression="{{ dlg.mentorExpr }}"></mentor-avatar>
       </sc-if>
       <sc-if value="{{ dlg.isNara }}" hint-placeholder-val="{{ true }}">
         <nexa-avatar size="196" state="{{ dlg.nexaState }}"></nexa-avatar>
       </sc-if>
     </div>
     <div style="text-align:center">
       <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:11px;letter-spacing:.26em;color:{{ dlg.color }}">{{ dlg.name }}</div>
       <div style="font-size:11.5px;color:#7d8fa6;letter-spacing:.08em;margin-top:5px">{{ dlg.state }}</div>
     </div>
   </aside>
  </div>
</div>
</sc-if>

<!-- ══════ 03 TUTORIAL ══════ -->
<sc-if value="{{ isTutorial }}" hint-placeholder-val="{{ false }}">
<div style="position:relative;min-height:calc(100vh - 92px);display:grid;place-items:center;padding:30px 24px;animation:nx-in .8s ease both" data-screen-label="03 Tutorial">
  <div style="width:min(980px,100%)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:11px;letter-spacing:.38em;color:#35F2A1">CARA BERMAIN</div>
        <h1 style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-weight:700;font-size:clamp(20px,2.6vw,30px);margin:10px 0 0;letter-spacing:.04em">{{ tut.title }}</h1>
      </div>
      <div style="display:flex;gap:6px">
        <sc-for list="{{ tutDots }}" as="d" hint-placeholder-count="4"><span style="width:{{ d.w }};height:8px;border-radius:999px;background:{{ d.bg }};transition:all .3s"></span></sc-for>
      </div>
    </div>
    <p style="font-size:clamp(14px,1.35vw,16.5px);color:#C9D4E0;line-height:1.6;margin:14px 0 22px;max-width:720px;text-wrap:pretty">{{ tut.body }}</p>

    <div style="padding:24px;border-radius:22px;background:rgba(7,20,38,.72);border:1px solid rgba(23,217,255,.3);backdrop-filter:blur(12px);min-height:230px;display:grid;place-items:center">
      <!-- step 1: slider demo -->
      <sc-if value="{{ tut.isSlider }}" hint-placeholder-val="{{ true }}">
      <div style="width:100%;display:flex;flex-wrap:wrap;gap:24px;align-items:center">
        <div style="flex:1 1 260px;display:grid;place-items:center;min-height:170px">
          <div style="position:relative;width:150px;height:150px;display:grid;place-items:center">
            <div style="position:absolute;width:{{ demoHalo }};height:{{ demoHalo }};border-radius:50%;background:rgba(23,217,255,.18);transition:all .4s"></div>
            <div style="position:absolute;width:56px;height:56px;border-radius:50%;background:{{ demoFill }};border:2px solid #F5F8FC;transition:background .4s"></div>
            <div style="position:absolute;bottom:-4px;font-size:11px;color:#91A4B8">1 siswa</div>
          </div>
        </div>
        <div style="flex:1 1 280px">
          <label style="display:block"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span>Keterlibatan AI</span><span style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;color:#17D9FF">{{ demoVal }}</span></div><input class="nx" type="range" min="0" max="100" value="{{ demoVal }}" onChange="{{ setDemo }}" aria-label="Demo keterlibatan AI"></label>
          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
            <span style="font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid #17D9FF;color:#17D9FF">Inovasi {{ demoD1 }}</span>
            <span style="font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid #FFC857;color:#FFC857">Kemanusiaan {{ demoD2 }}</span>
          </div>
          <div style="font-size:12.5px;color:#91A4B8;margin-top:12px;line-height:1.55">Geser — lingkaran cahaya di sebelah adalah dukungan AI pada seorang siswa. Chip di atas memperlihatkan akibatnya sebelum kamu mengunci.</div>
        </div>
      </div>
      </sc-if>
      <!-- step 2: allocation demo -->
      <sc-if value="{{ tut.isAlloc }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;display:flex;flex-wrap:wrap;gap:24px;align-items:center">
        <div style="flex:1 1 240px;display:grid;place-items:center">
          <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
            <div style="width:{{ demoNode }};height:{{ demoNode }};border-radius:50%;background:radial-gradient(circle,rgba(118,87,255,.55),rgba(118,87,255,.12) 70%);border:1.5px solid #7657FF;box-shadow:0 0 {{ demoNodeGlow }} #7657FF;display:grid;place-items:center;font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-weight:700;font-size:16px;transition:all .4s cubic-bezier(.2,.8,.2,1)">{{ demoUnits }}</div>
            <div style="font-size:12px;font-weight:600">Kreativitas</div>
            <div style="display:flex;gap:8px">
              <button onClick="{{ demoDec }}" aria-label="Kurangi" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(145,164,184,.4);background:rgba(7,20,38,.8);color:#F5F8FC;cursor:pointer;font-size:17px;line-height:1">−</button>
              <button onClick="{{ demoInc }}" aria-label="Tambah" style="width:36px;height:36px;border-radius:50%;border:1px solid #7657FF;background:rgba(7,20,38,.8);color:#B8A6FF;cursor:pointer;font-size:17px;line-height:1">+</button>
            </div>
          </div>
        </div>
        <div style="flex:1 1 280px">
          <div style="font-size:12.5px;color:#C9D4E0;margin-bottom:10px">Seret kotak energi ke node, atau tekan + / − (lebih mudah di layar sentuh).</div>
          <div onDragOver="{{ allowDrop }}" onDrop="{{ demoDrop }}" style="display:flex;gap:7px;flex-wrap:wrap;padding:14px;border-radius:14px;border:1px dashed rgba(118,87,255,.4)">
            <sc-for list="{{ demoPool }}" as="u" hint-placeholder-count="6"><div draggable="{{ u.drag }}" onDragStart="{{ u.onDragStart }}" style="width:28px;height:28px;border-radius:7px;background:{{ u.bg }};border:1px solid {{ u.border }};box-shadow:0 0 8px {{ u.glow }};cursor:{{ u.cursor }}"></div></sc-for>
          </div>
          <div style="font-size:12px;color:#91A4B8;margin-top:10px">Energi selalu terbatas. Menambah satu hal berarti mengurangi yang lain — itulah inti NEXA.</div>
        </div>
      </div>
      </sc-if>
      <!-- step 3: decision demo -->
      <sc-if value="{{ tut.isDecision }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;max-width:620px">
        <div style="font-family:Orbitron,Bahnschrift,system-ui,sans-serif;font-size:10px;letter-spacing:.3em;color:#FFC857">CONTOH PRINSIP</div>
        <div style="font-weight:600;font-size:15px;margin:10px 0 14px">Siapa yang memegang keputusan akhir?</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ demoOpts }}" as="o" hint-placeholder-count="3">
            <button onClick="{{ o.pick }}" style="text-align:left;font-size:13.5px;line-height:1.45;padding:13px 15px;border-radius:12px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;transition:all .25s;min-height:48px" style-hover="border-color:#F5F8FC">{{ o.label }}</button>
          </sc-for>
        </div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  SAVE_KEY = 'nexa_save_v2';
  SETTINGS_KEY = 'nexa_settings_v2';
  REFLECT_KEY = 'nexa_reflect_v2';
  C = { cyan: '#17D9FF', violet: '#7657FF', lilac: '#B8A6FF', green: '#35F2A1', gold: '#FFC857', white: '#F5F8FC', steel: '#91A4B8' };
  DEFAULTS = {
    school: { ai: 50, guru: 50, personal: 50, mandiri: 50, sosial: 50, kreatif: 50 },
    city: { pengawasan: 50, transparansi: 50, data: 50, sustain: 50, otomasi: 50, akses: 50, darurat: 50 },
    work: { tech: 0, kreatif: 0, empati: 0, komunikasi: 0, kritis: 0, adaptif: 0, lifelong: 0 }
  };
  freshProgress() {
    const D = this.DEFAULTS;
    return {
      completed: {}, deltas: {}, results: {}, prevBalance: null, result: null, civ: {}, fired: {}, event: null, committed: {},
      school: Object.assign({}, D.school), city: Object.assign({}, D.city), work: Object.assign({}, D.work),
      hasSave: false, saveDone: 0, dlgIdx: 0, dlgHidden: false, settingsOpen: false, feedback: null,
      quizAns: [], quizIdx: 0, quizScore: null, quizTries: 0
    };
  }
  state = Object.assign({
    screen: 'opening', muted: false, subs: true, musicVol: 40, voiceVol: 80, sfxVol: 60,
    subVisible: '', subPending: null, voSpeaking: false, voSource: null,
    tutStep: 0, demoVal: 50, demoUnits: 2, demoPick: null, reflectA: '', reflectB: '', copied: false, creditsOpen: false
  }, {
    completed: {}, deltas: {}, results: {}, prevBalance: null, result: null, civ: {}, fired: {}, event: null, committed: {},
    school: { ai: 50, guru: 50, personal: 50, mandiri: 50, sosial: 50, kreatif: 50 },
    city: { pengawasan: 50, transparansi: 50, data: 50, sustain: 50, otomasi: 50, akses: 50, darurat: 50 },
    work: { tech: 0, kreatif: 0, empati: 0, komunikasi: 0, kritis: 0, adaptif: 0, lifelong: 0 },
    hasSave: false, saveDone: 0, dlgIdx: 0, dlgHidden: false, settingsOpen: false, feedback: null,
    quizAns: [], quizIdx: 0, quizScore: null, quizTries: 0
  });
  timers = []; audio = null; lastDlgKey = ''; lastScreen = ''; dragKey = null; fbTimer = null;

  componentDidMount() {
    try {
      const st = JSON.parse(localStorage.getItem(this.SETTINGS_KEY) || 'null');
      if (st) this.setState({ muted: !!st.muted, subs: st.subs !== false, musicVol: st.musicVol ?? 40, voiceVol: st.voiceVol ?? 80, sfxVol: st.sfxVol ?? 60 });
      const rf = JSON.parse(localStorage.getItem(this.REFLECT_KEY) || 'null');
      if (rf) this.setState({ reflectA: rf.a || '', reflectB: rf.b || '' });
      const raw = localStorage.getItem(this.SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw), done = Object.keys(s.completed || {}).length;
        if (done > 0) this.setState({ hasSave: true, saveDone: done }); else localStorage.removeItem(this.SAVE_KEY);
      }
    } catch (e) { }
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); clearTimeout(this.fbTimer); if (this.unsubVoice) this.unsubVoice(); if (this.VM) this.VM.stopVoice(); if (this.audio && this.audio.ctx) this.audio.ctx.close(); }
  componentDidUpdate() {
    const S = this.state;
    if (S.screen !== this.lastScreen) {
      this.lastScreen = S.screen;
      this.playBgm(S.screen);
      this.stopAside();   // suara sampingan milik layar lama
      if (S.event && !['school', 'city', 'work', 'civ'].includes(S.screen)) this.setState({ event: null });
    }
    const tutKey = S.screen === 'tutorial' ? 'tut:' + S.tutStep : '';
    if (tutKey !== this.lastTutKey) { this.lastTutKey = tutKey; if (tutKey) this.sayAside('nexa_tutorial_' + (Math.min(S.tutStep, 3) + 1)); }
    const v = this.dialogueFor(S);
    const key = v.show ? S.screen + ':' + S.dlgIdx : '';
    if (key !== this.lastDlgKey) { this.lastDlgKey = key; if (key) this.speak(v.dlg); else this.stopSpeech(); }
    try {
      localStorage.setItem(this.SETTINGS_KEY, JSON.stringify({ muted: S.muted, subs: S.subs, musicVol: S.musicVol, voiceVol: S.voiceVol, sfxVol: S.sfxVol }));
      localStorage.setItem(this.REFLECT_KEY, JSON.stringify({ a: S.reflectA, b: S.reflectB }));
      if (Object.keys(S.completed).length > 0) {
        const D = this.DEFAULTS, K = S.committed;
        localStorage.setItem(this.SAVE_KEY, JSON.stringify({ completed: S.completed, deltas: S.deltas, results: S.results, fired: S.fired, school: K.school || D.school, city: K.city || D.city, work: K.work || D.work, civ: K.civ || {}, quizScore: S.quizScore, quizTries: S.quizTries }));
      }
    } catch (e) { }
  }
  resetAll(toScreen) {
    try { localStorage.removeItem(this.SAVE_KEY); } catch (e) { }
    this.stopSpeech();
    this.setState(Object.assign(this.freshProgress(), { screen: toScreen }));
    this.sfx('click');
  }
  go(screen, extra) { this.setState(Object.assign({ screen, dlgIdx: 0, dlgHidden: false, settingsOpen: false, creditsOpen: false }, extra || {})); this.sfx('click'); }
  clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  hex(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  toast(text, color) {
    clearTimeout(this.fbTimer);
    this.setState({ feedback: { text, color: color || this.C.cyan, glow: this.hex(color || this.C.cyan, .35) } });
    this.fbTimer = setTimeout(() => this.setState({ feedback: null }), 2600);
  }

  // ───────── audio ─────────
  ensureAudio() {
    if (this.audio) return this.audio;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain(); master.connect(ctx.destination);
      const music = ctx.createGain(); music.connect(master);
      const sfx = ctx.createGain(); sfx.connect(master);
      this.audio = { ctx, master, music, sfx, bgm: null };
      this.applyVolumes(); this.playBgm(this.state.screen);
    } catch (e) { this.audio = null; }
    return this.audio;
  }
  applyVolumes() {
    if (!this.audio) return; const S = this.state, t = this.audio.ctx.currentTime;
    this.audio.master.gain.setTargetAtTime(S.muted ? 0 : 1, t, .05);
    this.audio.music.gain.setTargetAtTime((S.musicVol / 100) * .35, t, .3);
    this.audio.sfx.gain.setTargetAtTime((S.sfxVol / 100) * .6, t, .05);
  }
  playBgm(screen) {
    const A = this.audio; if (!A || !window.NexaBGM) return;
    if (!A.bgm) A.bgm = window.NexaBGM.create(A.ctx, A.music);   // js/bgm.js: pad + progresi akor pelan
    A.bgm.setScreen(screen);
  }
  sfx(kind, val) {
    const A = this.audio; if (!A || this.state.muted) return;
    const c = A.ctx, t = c.currentTime;
    const tone = (f, dur, type, g, at) => {
      const o = c.createOscillator(), gn = c.createGain();
      o.type = type || 'sine'; o.frequency.value = f; gn.gain.value = 0;
      gn.gain.linearRampToValueAtTime(g || .3, t + (at || 0) + .01);
      gn.gain.exponentialRampToValueAtTime(.0001, t + (at || 0) + dur);
      o.connect(gn); gn.connect(A.sfx); o.start(t + (at || 0)); o.stop(t + (at || 0) + dur + .05);
    };
    if (kind === 'click') { tone(520, .09, 'triangle', .25); tone(780, .12, 'triangle', .2, .07); }
    else if (kind === 'slider') tone(700 + (val || 50) * 6, .04, 'square', .05);
    else if (kind === 'unit') tone(980, .07, 'triangle', .18);
    else if (kind === 'lock') { tone(261.6, 1.2, 'sine', .25); tone(329.6, 1.2, 'sine', .2, .05); tone(392, 1.2, 'sine', .2, .1); tone(523.3, 1.4, 'triangle', .15, .15); }
    else if (kind === 'event') { tone(180, .35, 'sine', .3); tone(180, .35, 'sine', .3, .45); }
    else if (kind === 'seal') { tone(130.8, 1.6, 'sine', .3); tone(392, 1.8, 'triangle', .14, .2); }
    else if (kind === 'ending') [130.8, 164.8, 196, 261.6, 329.6].forEach((f, i) => tone(f, 3.5, 'sine', .18, i * .18));
  }
  /* ───────── voice over (aset eksternal + fallback subtitle) ───────── */
  get VM() { return window.VoiceManager || null; }
  bindVoice() {
    const VM = this.VM; if (!VM || this.voiceBound) return;
    this.voiceBound = true;
    const S = this.state;
    VM.setVolume(S.voiceVol / 100).setMuted(!!S.muted).enableSubtitle(S.subs !== false);
    this.unsubVoice = VM.onSubtitle(p => {
      if (!p.id) { if (this.curVo) this.setState({ subVisible: '', subPending: null, voSpeaking: false }); return; }   // abaikan berhentinya suara sampingan
      if (p.id !== this.curVo) return;   // buang payload dari baris yang sudah ditinggalkan
      this.setState({
        subVisible: p.visible, subPending: p.full.slice(p.visible.length),
        voSpeaking: p.speaking && !p.done, voSource: p.source
      });
    });
  }
  speak(dlg) {
    const VM = this.VM;
    if (!dlg || !dlg.text) return;
    if (!VM || !dlg.vo) {
      this.curVo = null;
      this.setState({ subVisible: dlg.text, subPending: '', voSpeaking: false, voSource: 'none' });
      return;
    }
    this.bindVoice();
    if (VM.state().id) VM.stopVoice();        // bersihkan baris lama sebelum kursor pindah
    this.curVo = dlg.vo;
    this.setState({ subVisible: '', subPending: dlg.text, voSpeaking: true });
    VM.playVoice(dlg.vo);
    if (dlg.voNext) VM.preload(dlg.voNext);   // lazy: hanya baris berikutnya
  }
  stopSpeech() {
    const VM = this.VM, cur = this.curVo;
    this.curVo = null;
    if (VM && cur && VM.state().id === cur) VM.stopVoice();   // suara sampingan dibiarkan selesai
    this.setState({ subVisible: '', subPending: null, voSpeaking: false });
  }
  // Suara sampingan: kartu warga, regulator, peristiwa, tutorial. Tidak memakai kotak dialog;
  // baris dialog yang sedang diucapkan dihentikan dan teksnya ditampilkan utuh.
  sayAside(id) {
    const VM = this.VM;
    if (!VM || !id) return;
    this.bindVoice();
    const talking = this.curVo, full = (this.state.subVisible || '') + (this.state.subPending || '');
    this.curVo = null;
    VM.playVoice(id);
    if (talking) this.setState({ subVisible: full, subPending: '', voSpeaking: false });
  }
  stopAside(prefix) {
    const VM = this.VM, id = VM && VM.state().id;
    if (id && id !== this.curVo && (!prefix || id.indexOf(prefix) === 0)) VM.stopVoice();
  }

  // ───────── frozen simulation maths (v2.1) ─────────
  balanceFrom(deltas) {
    const out = { inov: 50, human: 50, sust: 50, resp: 50 };
    Object.values(deltas).forEach(d => { for (const k in out) out[k] += d[k] || 0; });
    for (const k in out) out[k] = this.clamp(out[k]);
    return out;
  }

      sealReading: civPicked === 0 ? 'Segel masih kosong. Setiap prinsip yang kamu pilih menjadi satu segmen.' : civPicked < 6 ? `${civPicked} dari 6 segmen terbentuk. Sejauh ini condong ${lean.ai > lean.hum ? 'memberi ruang pada AI' : lean.hum > lean.ai ? 'menjaga kendali manusia' : 'seimbang'}.` : `Segel lengkap: ${lean.ai} prinsip condong AI, ${lean.bal} seimbang, ${lean.hum} condong manusia.`,
      civDeltaChips: chips(cvd), civLockDisabled: civPicked < 6, civLockOpacity: civPicked < 6 ? '.45' : '1',
      civLockLabel: civPicked < 6 ? `PUTUSKAN ${6 - civPicked} PRINSIP LAGI` : 'SEGEL KONSTITUSI ›',
      finishCiv: () => {
        if (civPicked < 6) { this.toast(`Masih ada ${6 - civPicked} prinsip yang belum diputuskan.`, C.gold); return; }
        const t = [];
        if (lean.ai >= 3) t.push({ up: 'Kecepatan keputusan', down: 'Akuntabilitas manusia', upColor: C.cyan, downColor: C.lilac });
        if (lean.hum >= 3) t.push({ up: 'Kendali manusia', down: 'Kecepatan sistem', upColor: C.gold, downColor: C.cyan });
        if (lean.bal >= 3) t.push({ up: 'Tanggung jawab', down: 'Otonomi AI', upColor: C.lilac, downColor: C.green });
        if (S.civ.p2 === 1) t.push({ up: 'Kepemilikan data individu', down: 'Kemudahan layanan', upColor: C.gold, downColor: C.cyan });
        if (S.civ.p5 === 0) t.push({ up: 'Kesederhanaan', down: 'Transparansi', upColor: C.cyan, downColor: C.lilac });
        this.complete('civ', cvd, {
          id: 'civ', tradeoffs: t.slice(0, 4), badge: 'PENJAGA NILAI',
          reflection: lean.ai >= 4 ? 'Konstitusimu memberi AI ruang gerak luas. Sistem akan cepat — tetapi saat salah, siapa yang menjawab?' : lean.hum >= 4 ? 'Konstitusimu menempatkan manusia di hampir setiap keputusan. Aman, tetapi apakah manusia sanggup meninjau semuanya?' : 'Konstitusimu mencari jalan tengah: AI bekerja dalam batas yang bisa dijelaskan dan dipertanyakan.',
          takeaway: 'Konstitusi AI pada dasarnya adalah pernyataan nilai: siapa yang bertanggung jawab, siapa yang memiliki data, dan kapan manusia harus hadir. Simulasi ini menunjukkan satu kemungkinan akibat dari pilihanmu — teknologinya bisa berubah, nilainya yang perlu dibahas bersama.'
        });
      },
      // result
      resultModuleName: names[R.id] || '', resultBadge: R.badge || '', tradeoffs: R.tradeoffs || [], reflection: R.reflection || '', takeaway: R.takeaway || '',
      resultCitizens: this.citizenVoices(R.id, bal),
      reopenModule: () => this.go(R.id || 'hub'),
      resultNext: () => { if (R.id === 'civ') { this.go('profile'); this.sfx('ending'); } else this.go('hub'); },
      resultNextLabel: R.id === 'civ' ? 'LIHAT DUNIA YANG TERBENTUK ›' : 'KEMBALI KE LAB ›',
      // profile / summary / reflection
      endingCitizens: this.endingVoices(bal),
      endingTitle: E.title, endingColor: E.color, endingGlow: hex(E.color, .18), endingFill: hex(E.color, .22), endingDesc: E.desc, archetype: E.archetype, endingVariant: E.variant, endingPath,
      ...this.quizVals(S),
      profileCta: doneCount < 4 ? 'LANJUTKAN SIMULASI ›' : S.quizScore == null ? 'UJI PEMAHAMAN ›' : 'HASIL AKHIR & DISKUSI ›',
      profileNext: () => doneCount < 4 ? this.go('hub') : S.quizScore == null ? this.go('quiz', { quizIdx: 0, quizAns: [] }) : this.go('summary'),
      allTradeoffs, civSummary, discussion,
      reflectFields: [
        { label: 'Satu hal yang berubah dalam caraku memandang AI:', value: S.reflectA, placeholder: 'Tulis satu kalimat…', onChange: e => this.setState({ reflectA: e.target.value, copied: false }) },
        { label: 'Jika aku merancang ulang, yang akan kuubah lebih dulu:', value: S.reflectB, placeholder: 'Tulis satu kalimat…', onChange: e => this.setState({ reflectB: e.target.value, copied: false }) }
      ],
      copyLabel: S.copied ? 'TERSALIN ✓' : 'SALIN RINGKASAN UNTUK GURU',
      copySummary: () => {
        const txt = `NEXA — Profil Future Architect\nHasil: ${E.title} (${E.archetype})\nInovasi ${bal.inov} · Kemanusiaan ${bal.human} · Keberlanjutan ${bal.sust} · Tanggung Jawab ${bal.resp}\nModul selesai: ${doneCount}/4\nUji Pemahaman: ${S.quizScore == null ? 'belum dikerjakan' : S.quizScore + '/100 (' + this.quizGrade(S.quizScore).text + ', percobaan ke-' + S.quizTries + ')'}\n\nRefleksi 1: ${S.reflectA || '-'}\nRefleksi 2: ${S.reflectB || '-'}`;
        // Clipboard API bisa ditolak (izin, file://, browser lama): coba cara lama, dan beri tahu jujur bila gagal.
        const legacy = () => { try { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; } };
        const done = ok => { this.setState({ copied: ok }); this.toast(ok ? 'Ringkasan disalin ke papan klip.' : 'Browser menolak menyalin otomatis. Tulis ulang jawabanmu atau minta bantuan guru.', ok ? C.green : C.gold); };
        this.sfx('click');
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), () => done(legacy()));
        else done(legacy());
      },
      // dialogue
      showDialogue: D.show, dlg: D.dlg,
      nextDlg: () => { this.stopSpeech(); this.setState({ dlgIdx: S.dlgIdx + 1 }); },
      skipDlg: () => { this.stopSpeech(); this.setState({ dlgHidden: true }); },
      replayDlg: () => this.speak(D.dlg),
      subVisible: S.subs === false ? D.dlg.text : (S.subVisible || ''),
      subPending: S.subs === false ? '' : (S.subPending != null ? S.subPending : D.dlg.text),
      voSpeaking: !!S.voSpeaking,
      voBadge: S.voSource === 'audio' ? 'VO' : S.voSource === 'none' ? 'TEKS' : 'TEKS+SFX',
      voColor: S.voSource === 'audio' ? C.green : C.steel,
      voBorder: S.voSource === 'audio' ? hex(C.green, .45) : 'rgba(145,164,184,.3)',
      voTitle: S.voSource === 'audio' ? 'Voice over terekam sedang diputar' : 'Belum ada file suara untuk baris ini — subtitle dan SFX yang dipakai',
      dlgNextLabel: S.dlgIdx + 1 < D.script.length ? 'LANJUT ›' : 'MULAI'
    };
  }
}
</script>
</body>
</html>
